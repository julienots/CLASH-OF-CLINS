name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck && npm test && npm run test:long
      - run: npm run build && CHROME_PATH=$(which google-chrome) npm run test:e2e
      - run: |
          sudo apt-get update && sudo apt-get install -y aapt apksigner zipalign android-sdk-platform-23 dalvik-exchange
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          BUNDLETOOL=$PWD/bundletool.jar ANDROID_SDK=/usr/lib/android-sdk bash android/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: kingdoms-android, path: dist/ }
